    <line x1="50" y1="90" x2="1630" y2="90" stroke="#253A66" stroke-width="1.5"/>
    
    <text x="50" y="160" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Midjourney v6.0</text>
