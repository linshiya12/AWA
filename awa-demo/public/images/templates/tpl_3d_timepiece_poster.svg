      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#121115"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <radialGradient id="tp_gold" cx="50%" cy="45%" r="45%">
