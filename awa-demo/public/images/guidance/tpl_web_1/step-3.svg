<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser / App Window Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>

  <!-- Address / Tool Tab Pill -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="200" cy="24" r="4" fill="#3B82F6"/>
  <text x="214" y="28" fill="#93C5FD" font-size="11" class="font-mono font-sans" opacity="0.85">v0.dev/chat</text>

  <!-- Top Right Tool Badge -->
  <rect x="660" y="12" width="116" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="718" y="28" fill="#E2E8F0" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">LANDING PAGES</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <!-- Step Badge -->
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#3B82F6" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 03 // LIVE CODE STREAMING</text>

    <!-- Step Title -->
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Watch Real-Time JSX Generation</text>
    <!-- Step Subtitle -->
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">v0 streams clean TypeScript code and renders live component preview</text>
  </g>

  <!-- Visual Type: 4-Quadrant Preview / Render Sequence -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- 4-Grid Preview Thumbnails -->
    <g transform="translate(24, 24)">
      
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="216" height="116" rx="8" fill="#071224" stroke="#3B82F6" stroke-width="2"/>
            <!-- Placeholder Abstract Subject Artwork -->
            <ellipse cx="108" cy="58" rx="42" ry="24" fill="#3B82F6" fill-opacity="0.15"/>
            <rect x="88" y="38" width="40" height="40" rx="6" fill="#38BDF8" fill-opacity="0.8"/>
            <!-- Label Tag -->
            <rect x="8" y="8" width="86" height="20" rx="4" fill="#0A162B" fill-opacity="0.8"/>
            <text x="14" y="22" fill="#F8FAFC" font-size="10" font-weight="700" class="font-mono">JSX Code Stream</text>
            
              <circle cx="196" cy="18" r="7" fill="#3B82F6"/>
              <path d="M192 18 L195 21 L200 15" stroke="#FFFFFF" stroke-width="2" fill="none"/>
            
          </g>
        
          <g transform="translate(230, 0)">
            <rect x="0" y="0" width="216" height="116" rx="8" fill="#071224" stroke="#1E3A8A" stroke-width="1"/>
            <!-- Placeholder Abstract Subject Artwork -->
            <ellipse cx="108" cy="58" rx="42" ry="24" fill="#3B82F6" fill-opacity="0.22999999999999998"/>
            <rect x="88" y="38" width="40" height="40" rx="6" fill="#1E3A8A" fill-opacity="0.8"/>
            <!-- Label Tag -->
            <rect x="8" y="8" width="86" height="20" rx="4" fill="#0A162B" fill-opacity="0.8"/>
            <text x="14" y="22" fill="#94A3B8" font-size="10" font-weight="700" class="font-mono">Live Component Preview</text>
            
          </g>
        
          <g transform="translate(0, 128)">
            <rect x="0" y="0" width="216" height="116" rx="8" fill="#071224" stroke="#1E3A8A" stroke-width="1"/>
            <!-- Placeholder Abstract Subject Artwork -->
            <ellipse cx="108" cy="58" rx="42" ry="24" fill="#3B82F6" fill-opacity="0.31"/>
            <rect x="88" y="38" width="40" height="40" rx="6" fill="#1E3A8A" fill-opacity="0.8"/>
            <!-- Label Tag -->
            <rect x="8" y="8" width="86" height="20" rx="4" fill="#0A162B" fill-opacity="0.8"/>
            <text x="14" y="22" fill="#94A3B8" font-size="10" font-weight="700" class="font-mono">Tailwind Utility Tree</text>
            
          </g>
        
          <g transform="translate(230, 128)">
            <rect x="0" y="0" width="216" height="116" rx="8" fill="#071224" stroke="#1E3A8A" stroke-width="1"/>
            <!-- Placeholder Abstract Subject Artwork -->
            <ellipse cx="108" cy="58" rx="42" ry="24" fill="#3B82F6" fill-opacity="0.39"/>
            <rect x="88" y="38" width="40" height="40" rx="6" fill="#1E3A8A" fill-opacity="0.8"/>
            <!-- Label Tag -->
            <rect x="8" y="8" width="86" height="20" rx="4" fill="#0A162B" fill-opacity="0.8"/>
            <text x="14" y="22" fill="#94A3B8" font-size="10" font-weight="700" class="font-mono">Interactive Form State</text>
            
          </g>
        
    </g>

    <!-- Right Control Panel -->
    <g transform="translate(500, 24)">
      <rect x="0" y="0" width="212" height="272" rx="10" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>
      <text x="16" y="28" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1" class="font-mono">SELECTION &amp; UPSCALING</text>

      <rect x="16" y="44" width="180" height="48" rx="6" fill="#0F2447" stroke="#3B82F6" stroke-width="1"/>
      <text x="28" y="66" fill="#93C5FD" font-size="11" font-weight="700" class="font-sans">Selected Variant</text>
      <text x="28" y="82" fill="#F8FAFC" font-size="11" class="font-sans">Code Stream Complete (25s)</text>

      <!-- U1-U4 Buttons -->
      <g transform="translate(16, 110)">
        <rect x="0" y="0" width="38" height="32" rx="6" fill="#3B82F6" stroke="#3B82F6" stroke-width="1"/>
        <text x="19" y="20" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle" class="font-mono">U1</text>

        <rect x="46" y="0" width="38" height="32" rx="6" fill="#142647" stroke="#1E3A8A" stroke-width="1"/>
        <text x="65" y="20" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle" class="font-mono">U2</text>

        <rect x="92" y="0" width="38" height="32" rx="6" fill="#142647" stroke="#1E3A8A" stroke-width="1"/>
        <text x="111" y="20" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle" class="font-mono">U3</text>

        <rect x="138" y="0" width="38" height="32" rx="6" fill="#142647" stroke="#1E3A8A" stroke-width="1"/>
        <text x="157" y="20" fill="#94A3B8" font-size="11" font-weight="800" text-anchor="middle" class="font-mono">U4</text>
      </g>

      <!-- Primary Action -->
      <rect x="16" y="210" width="180" height="44" rx="8" fill="url(#accentGrad)"/>
      <text x="106" y="237" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Test Interactive Form</text>
    </g>
  </g>

</svg>