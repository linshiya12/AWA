<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser / App Window Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>

  <!-- Address / Tool Tab Pill -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="200" cy="24" r="4" fill="#14B8A6"/>
  <text x="214" y="28" fill="#93C5FD" font-size="11" class="font-mono font-sans" opacity="0.85">firefly.adobe.com/generate</text>

  <!-- Top Right Tool Badge -->
  <rect x="660" y="12" width="116" height="24" rx="6" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.5"/>
  <text x="718" y="28" fill="#E2E8F0" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">LIFESTYLE</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <!-- Step Badge -->
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#14B8A6" fill-opacity="0.2" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#14B8A6" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 01 // ENGINE SELECTION</text>

    <!-- Step Title -->
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Launch Adobe Firefly / Midjourney</text>
    <!-- Step Subtitle -->
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Open Text-to-Image with commercial licensing safety enabled</text>
  </g>

  <!-- Visual Type: Tool / Engine Selection -->
  <g transform="translate(32, 146)">
    <!-- Main Tool Workspace Card -->
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Left Active Tool Showcase -->
    <rect x="24" y="24" width="320" height="272" rx="12" fill="url(#cardGrad)" stroke="#14B8A6" stroke-width="1.2"/>
    <rect x="44" y="44" width="56" height="56" rx="12" fill="#14B8A6" fill-opacity="0.2" stroke="#14B8A6" stroke-width="1.5"/>
    <circle cx="72" cy="72" r="14" fill="#14B8A6"/>
    <path d="M66 72 L70 76 L78 68" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="114" y="66" fill="#F8FAFC" font-size="16" font-weight="800" class="font-sans">Adobe Firefly Text-to-Image</text>
    <text x="114" y="86" fill="#14B8A6" font-size="11" font-weight="600" class="font-sans">COMMERCIAL SAFE</text>

    <line x1="44" y1="120" x2="320" y2="120" stroke="#1E3A8A" stroke-width="1"/>

    <!-- Config Details -->
    <g transform="translate(44, 136)">
      
        <g transform="translate(0, 0)">
          <circle cx="6" cy="10" r="3" fill="#14B8A6"/>
          <text x="18" y="14" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">Tool: Adobe Firefly Image 3 Model</text>
        </g>
      
        <g transform="translate(0, 38)">
          <circle cx="6" cy="10" r="3" fill="#14B8A6"/>
          <text x="18" y="14" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">Aspect Ratio: 4:5 Vertical Mobile Ready</text>
        </g>
      
        <g transform="translate(0, 76)">
          <circle cx="6" cy="10" r="3" fill="#14B8A6"/>
          <text x="18" y="14" fill="#E2E8F0" font-size="12" font-weight="500" class="font-sans">Content Type: Photo (Natural Staging)</text>
        </g>
      
    </g>

    <!-- Right Configuration Drawer -->
    <rect x="368" y="24" width="344" height="272" rx="12" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>
    
    <text x="392" y="54" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">ENVIRONMENT STATUS</text>

    <!-- Active Indicator -->
    <rect x="392" y="70" width="296" height="42" rx="8" fill="#0F2447" stroke="#2563EB" stroke-width="1"/>
    <circle cx="414" cy="91" r="5" fill="#10B981"/>
    <text x="430" y="95" fill="#F8FAFC" font-size="12" font-weight="600" class="font-sans">Engine Ready: Adobe Firefly Text-to-Image</text>

    <!-- Secondary Parameter Badges -->
    <text x="392" y="144" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">RECOMMENDED SETTINGS</text>
    <rect x="392" y="158" width="140" height="32" rx="6" fill="#142647" stroke="#1E3A8A" stroke-width="1"/>
    <text x="462" y="178" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Mode: Text-to-Image</text>

    <rect x="548" y="158" width="140" height="32" rx="6" fill="#142647" stroke="#1E3A8A" stroke-width="1"/>
    <text x="618" y="178" fill="#93C5FD" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Tier: Pro / Standard</text>

    <!-- Bottom Launch Button -->
    <rect x="392" y="234" width="296" height="46" rx="10" fill="url(#accentGrad)"/>
    <text x="540" y="262" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" class="font-sans">Ready to Configure Workflow →</text>
  </g>

</svg>