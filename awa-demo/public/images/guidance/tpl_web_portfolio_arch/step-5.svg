<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#081226"/>
      <stop offset="100%" stop-color="#060C1B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1D38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081326" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", Menlo, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="360" ry="140" fill="url(#glowGrad)"/>

  <!-- App Window Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A1428" fill-opacity="0.95"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Window Dots -->
  <circle cx="28" cy="24" r="5" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="46" cy="24" r="5" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="64" cy="24" r="5" fill="#10B981" fill-opacity="0.85"/>

  <!-- Tool Address Bar -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1D38" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="200" cy="24" r="4" fill="#10B981"/>
  <text x="214" y="28" fill="#93C5FD" font-size="11" class="font-mono" opacity="0.9">v0-dev // Step 05</text>

  <!-- Right Step Badge -->
  <rect x="670" y="12" width="105" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="722" y="28" fill="#E2E8F0" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">STEP 05 / 05</text>

  <!-- Central Canvas Card -->
  <rect x="40" y="70" width="720" height="340" rx="16" fill="url(#cardGrad)" stroke="#1E3A8A" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Visual Wireframe Elements Inside Card -->
  <rect x="70" y="100" width="310" height="280" rx="12" fill="#060C1B" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="225" cy="230" r="70" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="225" cy="230" r="30" fill="#10B981" fill-opacity="0.2"/>
  <circle cx="225" cy="230" r="6" fill="#10B981"/>

  <!-- Right Controls / Property Panel -->
  <rect x="410" y="100" width="320" height="280" rx="12" fill="#060C1B" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.4"/>
  <text x="430" y="135" fill="#FFFFFF" font-size="16" font-weight="700" class="font-sans">Step 5: Deploy to Vercel Portfolio</text>
  
  <rect x="430" y="155" width="280" height="1" fill="#1E3A8A" opacity="0.6"/>

  <!-- Instructions text wrapped in SVG -->
  <text x="430" y="185" fill="#94A3B8" font-size="12" class="font-sans">Configuration &amp; Action Parameters:</text>

  <rect x="430" y="200" width="280" height="60" rx="8" fill="#0B162C" stroke="#1E3A8A" stroke-width="0.8"/>
  <text x="442" y="222" fill="#E2E8F0" font-size="11" class="font-mono">Deploy the sleek architectural website dir</text>
  <text x="442" y="242" fill="#93C5FD" font-size="11" class="font-mono">ectly to Vercel with lightning-fast image op</text>

  <!-- Status Chip -->
  <rect x="430" y="280" width="130" height="28" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
  <text x="495" y="298" fill="#F8FAFC" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Active Setup</text>

  <rect x="575" y="280" width="135" height="28" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
  <text x="642" y="298" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">&#x2713; Verified Output</text>

  <!-- Bottom Bar -->
  <rect x="0" y="452" width="800" height="48" rx="0" fill="#070E1E" fill-opacity="0.9"/>
  <line x1="0" y1="452" x2="800" y2="452" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="50" cy="476" r="4" fill="#10B981"/>
  <text x="64" y="480" fill="#94A3B8" font-size="11" class="font-mono">AWA Production Blueprint // v0-dev Validated</text>
  <text x="750" y="480" fill="#64748B" font-size="11" text-anchor="end" class="font-mono">60fps / Lossless</text>
</svg>