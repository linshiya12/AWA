<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="200" cy="24" r="4" fill="#10B981"/>
  <text x="214" y="28" fill="#A7F3D0" font-size="11" class="font-mono" opacity="0.9">v0.dev/chat · Mobile Touch &amp; GPU Profiling</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#34D399" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 04 // 60FPS OPTIMIZATION</text>
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Optimize 60fps Shaders &amp; Touch Orbit</text>
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Clamp pixel ratio to 2, configure frustum culling, and enable mobile two-finger gestures</text>
  </g>

  <!-- Workspace Card -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Left Profiler Diagnostics -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="340" height="272" rx="12" fill="#040814" stroke="#10B981" stroke-width="1.2"/>
      <text x="20" y="32" fill="#10B981" font-size="11" font-weight="bold" class="font-mono">WEBGL PIPELINE AUDIT</text>

      <!-- Draw Calls Meter -->
      <rect x="20" y="48" width="300" height="48" rx="8" fill="#0B1528" stroke="#1E3A8A" stroke-width="1"/>
      <text x="32" y="70" fill="#94A3B8" font-size="10" class="font-mono">DRAW CALLS PER FRAME</text>
      <text x="32" y="86" fill="#F8FAFC" font-size="14" font-weight="bold" class="font-mono">18 calls <tspan fill="#10B981" font-size="10">(Target: &lt;50)</tspan></text>

      <!-- Shader Program Memory -->
      <rect x="20" y="106" width="300" height="48" rx="8" fill="#0B1528" stroke="#1E3A8A" stroke-width="1"/>
      <text x="32" y="128" fill="#94A3B8" font-size="10" class="font-mono">VRAM GEOMETRY BUFFER</text>
      <text x="32" y="144" fill="#F8FAFC" font-size="14" font-weight="bold" class="font-mono">4.2 MB <tspan fill="#10B981" font-size="10">● Instanced Meshes</tspan></text>

      <!-- Touch Gestures Status -->
      <rect x="20" y="164" width="300" height="88" rx="8" fill="#0B1528" stroke="#38BDF8" stroke-width="1"/>
      <text x="32" y="186" fill="#38BDF8" font-size="10" font-weight="bold" class="font-mono">MOBILE GESTURE BINDINGS</text>
      <text x="32" y="206" fill="#E2E8F0" font-size="11" class="font-sans">1 Finger: Orbital Azimuth &amp; Polar Pan</text>
      <text x="32" y="224" fill="#E2E8F0" font-size="11" class="font-sans">2 Fingers: Smooth Dolly Zoom &amp; Pinch</text>
      <text x="32" y="242" fill="#E2E8F0" font-size="11" class="font-sans">Touch-Action: none (No scroll clash)</text>
    </g>

    <!-- Right Mobile Viewport Preview -->
    <g transform="translate(388, 24)">
      <rect x="0" y="0" width="324" height="272" rx="12" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>
      <text x="24" y="32" fill="#F8FAFC" font-size="13" font-weight="700" class="font-sans">Mobile Viewport Simulation</text>

      <!-- Mini Phone Silhouette -->
      <g transform="translate(100, 50)">
        <rect x="0" y="0" width="124" height="200" rx="16" fill="#000000" stroke="#334155" stroke-width="3"/>
        <rect x="3" y="10" width="118" height="180" rx="12" fill="#050B17"/>
        <line x1="48" y1="6" x2="76" y2="6" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        
        <!-- 3D Arm on Phone -->
        <g transform="translate(62, 100)" scale="0.5">
          <ellipse cx="0" cy="30" rx="30" ry="8" fill="#1E293B"/>
          <line x1="0" y1="20" x2="-20" y2="-15" stroke="#FF6B00" stroke-width="5" stroke-linecap="round"/>
          <line x1="-20" y1="-15" x2="15" y2="-40" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Touch Pointer Dot -->
        <circle cx="75" cy="110" r="10" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.5"/>
        <circle cx="75" cy="110" r="3" fill="#FFFFFF"/>
        <text x="62" y="170" fill="#38BDF8" font-size="8" font-weight="bold" text-anchor="middle" class="font-mono">60 FPS SMOOTH</text>
      </g>
    </g>
  </g>
</svg>
