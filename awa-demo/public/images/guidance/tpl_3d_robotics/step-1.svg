<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>

  <!-- Address Bar -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#FF6B00" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="200" cy="24" r="4" fill="#FF6B00"/>
  <text x="214" y="28" fill="#FDBA74" font-size="11" class="font-mono" opacity="0.9">v0.dev/chat · 3D WebGL Configurator</text>

  <!-- Top Right Category Badge -->
  <rect x="650" y="12" width="126" height="24" rx="6" fill="#FF6B00" fill-opacity="0.15" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.6"/>
  <text x="713" y="28" fill="#FFEDD5" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">3D WEBSITES // R3F</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#FF6B00" fill-opacity="0.2" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#FF8A3D" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 01 // 3D CANVAS &amp; R3F</text>
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Initialize React Three Fiber Canvas</text>
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Setup Canvas container with OrbitControls, directional key lights, and Stage</text>
  </g>

  <!-- Workspace Card -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Left 3D Viewport Simulation -->
    <rect x="24" y="24" width="420" height="272" rx="12" fill="#040814" stroke="#FF6B00" stroke-width="1.2"/>

    <!-- 3D Grid Lines -->
    <line x1="44" y1="210" x2="424" y2="210" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="84" y1="235" x2="384" y2="235" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="124" y1="260" x2="344" y2="260" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Central 3D Robotic Arm Silhouette Vector -->
    <g transform="translate(234, 150)">
      <!-- Base Cylinder -->
      <ellipse cx="0" cy="50" rx="45" ry="12" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <rect x="-45" y="30" width="90" height="20" fill="#0F172A" stroke="#FF6B00" stroke-width="1.5"/>
      <ellipse cx="0" cy="30" rx="45" ry="12" fill="#334155" stroke="#FF6B00" stroke-width="1.5"/>
      <!-- Turret Joint -->
      <circle cx="0" cy="10" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <!-- Arm Segment 1 -->
      <line x1="0" y1="10" x2="-35" y2="-45" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>
      <!-- Elbow Joint -->
      <circle cx="-35" cy="-45" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <!-- Arm Segment 2 -->
      <line x1="-35" y1="-45" x2="25" y2="-85" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round"/>
      <!-- Wrist & Gripper -->
      <circle cx="25" cy="-85" r="10" fill="#FF6B00"/>
      <path d="M25 -85 L42 -100 M25 -85 L42 -70" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Canvas HUD Overlay -->
    <rect x="36" y="36" width="120" height="24" rx="6" fill="#0F172A" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="96" y="52" fill="#38BDF8" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">WEBGL 2.0 ACTIVE</text>

    <!-- Orbit Gizmo Top Right -->
    <circle cx="410" cy="50" r="18" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <text x="410" y="54" fill="#FF6B00" font-size="9" font-weight="bold" text-anchor="middle" class="font-mono">3D</text>

    <!-- Right Configuration Stack -->
    <g transform="translate(464, 24)">
      <rect x="0" y="0" width="248" height="272" rx="12" fill="url(#cardGrad)" stroke="#1E3A8A" stroke-width="1"/>
      <text x="20" y="32" fill="#F8FAFC" font-size="13" font-weight="700" class="font-sans">Canvas Dependencies</text>

      <rect x="20" y="48" width="208" height="34" rx="6" fill="#070C1A" stroke="#FF6B00" stroke-width="0.8"/>
      <text x="32" y="70" fill="#FED7AA" font-size="11" class="font-mono">@react-three/fiber</text>

      <rect x="20" y="90" width="208" height="34" rx="6" fill="#070C1A" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="32" y="112" fill="#BAE6FD" font-size="11" class="font-mono">@react-three/drei</text>

      <rect x="20" y="132" width="208" height="34" rx="6" fill="#070C1A" stroke="#64748B" stroke-width="0.8"/>
      <text x="32" y="154" fill="#94A3B8" font-size="11" class="font-mono">three (WebGL Engine)</text>

      <line x1="20" y1="180" x2="228" y2="180" stroke="#1E3A8A" stroke-width="1"/>

      <text x="20" y="202" fill="#94A3B8" font-size="10" font-weight="700" letter-spacing="1" class="font-mono">CAMERA DEFAULTS</text>
      <text x="20" y="222" fill="#E2E8F0" font-size="11" class="font-sans">FOV: 45° · Position: [0, 2, 5]</text>
      <text x="20" y="240" fill="#E2E8F0" font-size="11" class="font-sans">OrbitControls: damping = 0.05</text>
    </g>
  </g>
</svg>
