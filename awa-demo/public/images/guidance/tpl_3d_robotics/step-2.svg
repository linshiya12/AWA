<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#FF6B00" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="200" cy="24" r="4" fill="#FF6B00"/>
  <text x="214" y="28" fill="#FDBA74" font-size="11" class="font-mono" opacity="0.9">v0.dev/chat · CAD Node Hierarchy</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#FF6B00" fill-opacity="0.2" stroke="#FF6B00" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#FF8A3D" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 02 // CAD HIERARCHY</text>
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Configure Exploded-View Sub-Assemblies</text>
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Group limb components (Base, Shoulder, Elbow, Gripper) with animated lerp offsets</text>
  </g>

  <!-- Workspace Card -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Left Tree View of Robotic Components -->
    <rect x="24" y="24" width="280" height="272" rx="12" fill="#050A17" stroke="#1E3A8A" stroke-width="1"/>
    <text x="44" y="52" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">PART HIERARCHY</text>

    <!-- Node 1 -->
    <g transform="translate(44, 70)">
      <circle cx="6" cy="10" r="4" fill="#10B981"/>
      <text x="18" y="14" fill="#F8FAFC" font-size="12" font-weight="600" class="font-mono">arm_base.mesh</text>
      <text x="170" y="14" fill="#64748B" font-size="10" class="font-mono">offset: 0.0</text>
    </g>

    <!-- Node 2 -->
    <g transform="translate(44, 105)">
      <circle cx="6" cy="10" r="4" fill="#38BDF8"/>
      <text x="18" y="14" fill="#F8FAFC" font-size="12" font-weight="600" class="font-mono">shoulder_joint.gltf</text>
      <text x="170" y="14" fill="#FDBA74" font-size="10" class="font-mono">+0.45 Y</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(44, 140)">
      <circle cx="6" cy="10" r="4" fill="#FF6B00"/>
      <text x="18" y="14" fill="#F8FAFC" font-size="12" font-weight="600" class="font-mono">titan_elbow_servo</text>
      <text x="170" y="14" fill="#FDBA74" font-size="10" class="font-mono">+0.85 Y</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(44, 175)">
      <circle cx="6" cy="10" r="4" fill="#A855F7"/>
      <text x="18" y="14" fill="#F8FAFC" font-size="12" font-weight="600" class="font-mono">pneumatic_gripper</text>
      <text x="170" y="14" fill="#FDBA74" font-size="10" class="font-mono">+1.30 Y</text>
    </g>

    <rect x="44" y="225" width="240" height="45" rx="8" fill="#0E223D" stroke="#2563EB" stroke-width="1"/>
    <text x="56" y="244" fill="#93C5FD" font-size="10" font-weight="bold" class="font-mono">SPRING LERP CONSTANT</text>
    <text x="56" y="260" fill="#E2E8F0" font-size="11" class="font-mono">lerpFactor = 0.08 (Spring 60fps)</text>

    <!-- Right Exploded CAD Diagram -->
    <g transform="translate(324, 24)">
      <rect x="0" y="0" width="388" height="272" rx="12" fill="#040814" stroke="#FF6B00" stroke-width="1.2"/>
      
      <!-- Exploded Parts Visual Demonstration -->
      <g transform="translate(194, 230)">
        <!-- Part 1: Base -->
        <ellipse cx="0" cy="15" rx="55" ry="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
        <line x1="0" y1="15" x2="0" y2="-190" stroke="#FF6B00" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
        
        <!-- Part 2: Turret Joint (Floating) -->
        <circle cx="0" cy="-45" r="26" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
        <text x="40" y="-40" fill="#38BDF8" font-size="10" class="font-mono">Joint Assembly</text>
        
        <!-- Part 3: Titanium Bicep (Floating) -->
        <rect x="-14" y="-120" width="28" height="45" rx="6" fill="#1E293B" stroke="#FF6B00" stroke-width="2"/>
        <text x="40" y="-95" fill="#FF8A3D" font-size="10" class="font-mono">Linear Actuator</text>

        <!-- Part 4: Gripper (Floating High) -->
        <circle cx="0" cy="-175" r="16" fill="#0F172A" stroke="#A855F7" stroke-width="2"/>
        <path d="M-10 -175 L-22 -195 M10 -175 L22 -195" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
        <text x="40" y="-170" fill="#C084FC" font-size="10" class="font-mono">Haptic Gripper</text>
      </g>
    </g>
  </g>
</svg>
