<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser / App Window Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>

  <!-- Address / Tool Tab Pill -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="200" cy="24" r="4" fill="#EC4899"/>
  <text x="214" y="28" fill="#93C5FD" font-size="11" class="font-mono font-sans" opacity="0.85">framer.com/project</text>

  <!-- Top Right Tool Badge -->
  <rect x="660" y="12" width="116" height="24" rx="6" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="1" stroke-opacity="0.5"/>
  <text x="718" y="28" fill="#E2E8F0" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">PORTFOLIO SITES</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <!-- Step Badge -->
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#EC4899" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 04 // PALETTE SHUFFLE</text>

    <!-- Step Title -->
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Shuffle Pastel Palettes &amp; Fonts</text>
    <!-- Step Subtitle -->
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Click shuffle in Theme panel to cycle curated aesthetic color harmonies</text>
  </g>

  <!-- Visual Type: Camera &amp; Optics Dial -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Left Camera Spec Card -->
    <rect x="24" y="24" width="330" height="272" rx="12" fill="url(#cardGrad)" stroke="#1E3A8A" stroke-width="1"/>
    <text x="44" y="54" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">CAMERA BODY &amp; SENSOR</text>
    <text x="44" y="80" fill="#F8FAFC" font-size="17" font-weight="800" class="font-sans">Framer Theme Styler</text>

    <!-- Dial Graphic (Aperture / Zoom / Tilt) -->
    <g transform="translate(189, 175)">
      <!-- Outer Dial Ring -->
      <circle cx="0" cy="0" r="64" fill="#081426" stroke="#1E3A8A" stroke-width="6"/>
      <circle cx="0" cy="0" r="54" fill="#0F2447" stroke="#EC4899" stroke-width="2"/>
      <!-- Tick Marks -->
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(0)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(30)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(60)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(90)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(120)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(150)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(180)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(210)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(240)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(270)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(300)"/>
      
        <line x1="0" y1="-54" x2="0" y2="-48" stroke="#60A5FA" stroke-width="1.5" transform="rotate(330)"/>
      
      <!-- Needle -->
      <line x1="0" y1="0" x2="28" y2="-28" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="7" fill="#EF4444"/>
      <text x="0" y="32" fill="#F8FAFC" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">OPTICS</text>
    </g>

    <!-- Right Calibration Parameters -->
    <rect x="378" y="24" width="334" height="272" rx="12" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>
    <text x="402" y="54" fill="#94A3B8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">OPTICAL PARAMETERS</text>

    <!-- Parameter Card 1 -->
    <rect x="402" y="70" width="286" height="54" rx="8" fill="#0F2242" stroke="#1E3A8A" stroke-width="1"/>
    <text x="418" y="92" fill="#94A3B8" font-size="10" font-weight="600" class="font-sans">Optics / Focal Length</text>
    <text x="418" y="112" fill="#38BDF8" font-size="13" font-weight="700" class="font-sans">Theme: "Rose Quartz" / "Soft Sage"</text>

    <!-- Parameter Card 2 -->
    <rect x="402" y="136" width="286" height="54" rx="8" fill="#0F2242" stroke="#EC4899" stroke-width="1"/>
    <text x="418" y="158" fill="#94A3B8" font-size="10" font-weight="600" class="font-sans">Aperture / Motion Value</text>
    <text x="418" y="178" fill="#F8FAFC" font-size="13" font-weight="700" class="font-sans">Typography: Editorial Serif + Clean Sans</text>

    <!-- Parameter Card 3 -->
    <rect x="402" y="202" width="286" height="54" rx="8" fill="#0F2242" stroke="#1E3A8A" stroke-width="1"/>
    <text x="418" y="224" fill="#94A3B8" font-size="10" font-weight="600" class="font-sans">Contact Shadow &amp; Texture</text>
    <text x="418" y="244" fill="#A7F3D0" font-size="12" font-weight="600" class="font-sans">Card Radius: 24px Rounded Pill</text>
  </g>

</svg>