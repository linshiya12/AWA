<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="50%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#060D1E"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1E38" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081426" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142647" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0A162B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="800" height="500" rx="20" fill="url(#bgGrad)"/>
  <rect width="800" height="500" rx="20" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Ambient Glow -->
  <ellipse cx="400" cy="180" rx="350" ry="140" fill="url(#glowGrad)"/>

  <!-- Top Browser / App Window Chrome -->
  <rect x="0" y="0" width="800" height="48" rx="20" fill="#0A152A" fill-opacity="0.9"/>
  <line x1="0" y1="48" x2="800" y2="48" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="6" fill="#EF4444" fill-opacity="0.85"/>
  <circle cx="48" cy="24" r="6" fill="#F59E0B" fill-opacity="0.85"/>
  <circle cx="68" cy="24" r="6" fill="#10B981" fill-opacity="0.85"/>

  <!-- Address / Tool Tab Pill -->
  <rect x="180" y="10" width="440" height="28" rx="8" fill="#0E1E38" stroke="#2563EB" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="200" cy="24" r="4" fill="#10B981"/>
  <text x="214" y="28" fill="#93C5FD" font-size="11" class="font-mono font-sans" opacity="0.85">v0.dev/chat</text>

  <!-- Top Right Tool Badge -->
  <rect x="660" y="12" width="116" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="718" y="28" fill="#E2E8F0" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">LANDING PAGES</text>

  <!-- Step Header Banner -->
  <g transform="translate(32, 66)">
    <!-- Step Badge -->
    <rect x="0" y="0" width="190" height="22" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
    <text x="10" y="15" fill="#10B981" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">STEP 04 // ICON CUSTOMIZATION</text>

    <!-- Step Title -->
    <text x="0" y="44" fill="#F8FAFC" font-size="20" font-weight="800" class="font-sans">Customize Lucide Icons via Chat</text>
    <!-- Step Subtitle -->
    <text x="0" y="64" fill="#94A3B8" font-size="12" class="font-sans">Chat follow-up to switch icons to Zap, ShieldCheck, and Cpu components</text>
  </g>

  <!-- Visual Type: Studio Lighting &amp; Staging Schematic -->
  <g transform="translate(32, 146)">
    <rect x="0" y="0" width="736" height="320" rx="14" fill="url(#panelGrad)" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Studio Floor Grid (Isometric Perspective) -->
    <g stroke="#1E3A8A" stroke-opacity="0.4" stroke-width="0.8">
      <line x1="120" y1="280" x2="360" y2="40"/>
      <line x1="200" y1="280" x2="440" y2="40"/>
      <line x1="280" y1="280" x2="520" y2="40"/>
      <line x1="160" y1="120" x2="520" y2="120"/>
      <line x1="120" y1="200" x2="560" y2="200"/>
    </g>

    <!-- Center Stage / Pedestal -->
    <ellipse cx="360" cy="180" rx="90" ry="40" fill="#0D2347" stroke="#10B981" stroke-width="1.5"/>
    <ellipse cx="360" cy="170" rx="70" ry="28" fill="#14325E" stroke="#60A5FA" stroke-width="1"/>
    <!-- Product Silhouette -->
    <rect x="340" y="90" width="40" height="70" rx="8" fill="#38BDF8" fill-opacity="0.8" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="360" y="130" fill="#0A162B" font-size="9" font-weight="800" text-anchor="middle" class="font-mono">HERO</text>

    <!-- Key Light Softbox (Top-Left) -->
    <g transform="translate(110, 60)">
      <polygon points="0,15 45,0 55,30 10,45" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="1.5"/>
      <line x1="45" y1="20" x2="280" y2="130" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.7"/>
      <circle cx="25" cy="22" r="5" fill="#FFFFFF"/>
      <text x="0" y="-8" fill="#93C5FD" font-size="11" font-weight="700" class="font-sans">Icon 1: Zap (Performance)</text>
    </g>

    <!-- Rim Light (Right Back) -->
    <g transform="translate(560, 70)">
      <circle cx="20" cy="20" r="16" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
      <line x1="10" y1="30" x2="-140" y2="100" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.8"/>
      <text x="-40" y="-8" fill="#FCD34D" font-size="11" font-weight="700" class="font-sans">Icon 2: ShieldCheck (Enterprise Security)</text>
    </g>

    <!-- Fill Card / Reflector (Bottom-Right) -->
    <g transform="translate(480, 200)">
      <rect x="0" y="0" width="60" height="24" rx="4" transform="rotate(-25)" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="1.2"/>
      <text x="-10" y="44" fill="#E2E8F0" font-size="11" font-weight="600" class="font-sans">Icon 3: Cpu (AI Integration)</text>
    </g>

    <!-- Bottom Legend Bar -->
    <rect x="24" y="260" width="688" height="38" rx="8" fill="#0A162B" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="44" cy="279" r="4" fill="#10B981"/>
    <text x="56" y="283" fill="#E2E8F0" font-size="11" font-weight="600" class="font-sans">Staging Target: Subtle Slate Card Backgrounds</text>
    <rect x="580" y="266" width="120" height="26" rx="6" fill="#10B981" fill-opacity="0.2"/>
    <text x="640" y="283" fill="#93C5FD" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">CALIBRATED ✓</text>
  </g>

</svg>